[project]
name = "freelance-job-fit-radar"
version = "0.1.0"
description = "A portfolio MVP that matches sample freelance jobs to a profile and explains the fit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2,<3",
    "python-telegram-bot>=22,<23",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
